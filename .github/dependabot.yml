version: 2
updates:
  # Dependências npm de cada visual. Atualizações de desenvolvimento
  # chegam agrupadas em um único PR por visual.
  - package-ecosystem: npm
    directories:
      - /visuais/barraDePorcentagem
      - /visuais/velocimetro
      - /visuais/mapVisual
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Versões das actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
